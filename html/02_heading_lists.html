<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <h1>Lorem, ipsum.</h1>
    <h2>Lorem.</h2>
    <h3>Lorem, ipsum.</h3>
    <h4>Lorem ipsum dolor sit.</h4> 
    <h5>Lorem ipsum dolor sit.</h5>
    <h6>lorem</h6>
    <p>Lorem ipsum <em>dolor</em> sit.</p>
    <ol>
        <li>orange tea</li>
        <li>black tea</li>
        <li>brown tea</li>
    </ol>
    <div>
        <h1>Block elements</h1>
        <ul>
            <li>heading h1 to h6</li>
            <li>ul,ol</li>
            <li>li</li>
            <li>p</li>
        </ul>
    </div>
    <div>
        <h1>Inline elements</h1>
        <ul>
            <li>a tags</li>
            <li>img</li>
            <li>strong</li>
            <li>em</li>
        </ul>
    </div>
</body>
</html>
