<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        padding: 0;
        margin: 0;
        height: 100vh;
        background-color: #1a1a1a;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .card {
        background-color: #d5d5d5;
        padding: 30px;
        border-radius: 5px;
        width: 300px;
      }
      h2 {
        color: rgb(58, 122, 178);
        text-align: center;
        margin-bottom: 10px;
      }
      form {
        display: flex;
        flex-direction: column;
      }
      input {
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 5px;
        background-color: #c9c9c9;
        border: 1px solid black;
      }
      button {
        background-color: rgb(95, 86, 225);
        color: azure;
        border-radius: 5px;
        padding: 8px;
      }
      button:hover {
        background-color: #0f1f98;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Sign Up</h2>
      <form>
        <input type="username" placeholder="Username"/>
        <input type="email" placeholder="Email"/>
        <input type="password" placeholder="Passwod"/>
        <button type="submit">Sign Up</button>
      </form>
    </div>
  </body>
</html>
